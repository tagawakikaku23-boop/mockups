<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Design Proposal｜タガワキカク</title>
<style>
:root{--ink:#16181D;--muted:#6B6F78;--bg:#F6F5F1;--line:#E2E0DA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;text-align:center}
.en{font-size:12px;letter-spacing:.24em;font-weight:700;color:var(--muted);margin:0 0 14px}
h1{font-size:clamp(22px,5vw,30px);margin:0 0 16px;line-height:1.5}
p{line-height:1.9;color:var(--muted);font-size:14px;margin:0}
hr{border:0;border-top:1px solid var(--line);margin:28px auto;width:64px}
small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
<p class="en">DESIGN PROPOSAL</p>
<h1>タガワキカクのデザイン提案ページです</h1>
<p>ご案内したURLから、各サイトの見本をご覧ください。<br>ここに掲載しているページは、提案用のサンプルです。</p>
<hr>
<small>© タガワキカク</small>
</main>
</body>
</html>
